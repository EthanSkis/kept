      '</div>' +
      (all ? '<input id="entry-q" class="field sm" type="search" enterkeyhint="search" placeholder="Search your answers" autocomplete="off" value="' + esc(S.ui.q || '') + '" style="margin-top:24px">' : '') +
      '<div style="margin-top:8px">' + (groups || '<div class="muted" data-key="empty" style="padding:24px 0">' +
        (all ? 'Nothing matches “' + esc(q) + '”.' : 'No entries yet. Your answers will collect here.') + '</div>') + '</div>' +
    '</section>';
  };

  /* ---------- Weekly review ---------- */
  function weekData(off) {
    const days = weekDates().map((d) => addDays(d, off * 7));
    const keys = days.map(keyOf);
    const today = todayKey();
    const info = streakInfo();
    const counts = keys.map((k) => (k > today ? null : keptOf(peek(k)).filter(Boolean).length));
    const sum = (f) => keys.reduce((a, k) => a + (peek(k)[f] || 0), 0);
    const sleeps = keys.map((k) => peek(k).sleep).filter(Boolean);
    const bodies = keys.map((k) => bodyOf(peek(k)));
    const muscles = [...new Set(bodies.flatMap((x) => x.muscles))].filter((id) => GROUP[id]);
    const entries = keys.flatMap((k) => (peek(k).journal || []).map((e) => ({ k, e })));
    let quote = null;
    for (let i = entries.length - 1; i >= 0 && !quote; i--) {
      const e = entries[i].e;
      const a = e.qa ? e.qa.find((x) => x.a) : (e.text ? { q: e.prompt, a: e.text } : null);
      if (a) quote = { q: a.q, a: a.a, k: entries[i].k };
    }
    return {
      days, keys, counts,
      elapsed: keys.filter((k) => k <= today).length,
      kept: counts.filter((c) => c === 4).length,
      grace: keys.filter((k) => info.covered.has(k)),
      mind: sum('mindMins'), work: sum('workMins'),
      sleep: sleeps.length ? sleeps.reduce((a, x) => a + x.mins, 0) / sleeps.length : 0,
      sessions: bodies.filter((x) => x.muscles.length || x.cardio).length,
      cardio: bodies.reduce((a, x) => a + x.cardio, 0),
      muscles, skipped: GROUPS.filter((gr) => !muscles.includes(gr.id)).map((gr) => gr.name),
      prs: prsBetween(keys[0], keys[6]),
      quote
    };
  }
  const weekRange = (w) => w.days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + w.days[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  screens.week = () => {
    const off = Math.min(0, S.ui.weekOffset || 0);

        '</div></div>' +

      '</div>' +
      (w.prs.length ? '<div class="wsec"><div class="muted">Personal bests</div>' +

      (w.quote ? '<div class="wsec"><div class="muted">' + esc(w.quote.q || 'Journal') + '</div><blockquote class="wquote">“' + esc(w.quote.a) + '”</blockquote></div>' : '') +
      '<div class="push" style="padding-top:28px"><button class="btn" data-act="share-week">' + I.share + 'Share this week</button></div>' +
    '</section>';
  };

  /* ---------- Lifts sheet ---------- */
  function liftListHtml(k) {
    const sets = liftsOf(peek(k));
    if (!sets.length) return '<div class="muted" style="padding:14px 0">No sets yet.</div>';
    const groups = [];
    sets.forEach((x) => {
      let gr = groups.find((y) => sameEx(y.ex, x.ex));
      if (!gr) groups.push(gr = { ex: x.ex, sets: [] });
      gr.sets.push(x);
    });
    return groups.map((gr) => {
      const prev = bestBefore(gr.ex, k);
      const top = gr.sets.reduce((a, x) => (e1rm(x) > e1rm(a) ? x : a));
      const pr = prev && e1rm(top) > e1rm(prev);
      return '<div class="lift-group"><div class="row"><div>' + esc(gr.ex) + '</div>' +
        (pr ? '<div class="pr">↑ New best</div>' : prev ? '<div class="small">Best ' + fmtSet(prev) + '</div>' : '') + '</div>' +
        '<div class="lift-sets">' + gr.sets.map((x) => '<span class="lset">' + fmtSet(x) +
          '<button data-act="lift-del" data-v="' + x.id + '" aria-label="Remove set">×</button></span>').join('') + '</div></div>';
    }).join('');
  }

    openSheet(

  const POOLS = [

    [ // reflection

      'What did you learn today?',

      'When did you feel most like yourself today?',
      'What was harder than it needed to be?',

      'What are you looking forward to?'
    ]

  // Walk each pool with a stride coprime to its length: a new set every day, no repeats until a pool is used up.
  function questionsFor(date = new Date()) {
    const n = Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
    return POOLS.map((pool, i) => pool[((n * 7 + i * 5) % pool.length + pool.length) % pool.length]);
  }
  const J = { listening: false, interim: '', error: '' };
  let jRec = null;
  function jDraft() {
    const k = todayKey();
    let d = S.ui.journal;
    if (!d || d.date !== k || !Array.isArray(d.answers)) d = S.ui.journal = { date: k, answers: ['', '', ''], step: 0 };
    return d;
  }
  function jNext(dr) {
    const last = dr.step === 2;
    const ans = dr.answers[dr.step].trim();
    if (!last) return { label: ans ? 'Next' : 'Skip', disabled: false };
    return { label: 'Done', disabled: !dr.answers.some((a) => a.trim()) };
  }

  screens.journal = () => {
    const dr = jDraft();
    const qs = questionsFor();
    const step = dr.step;
    const ans = dr.answers[step];
    const has = !!(ans || J.interim);
    const nx = jNext(dr);
    const fresh = step === 0 && !dr.answers.some(Boolean) && !J.listening && !J.interim;
    const entries = (peek(todayKey()).journal || []).slice().reverse();
    const status = J.error ||
      (J.listening ? (has ? 'Listening…' : 'Listening. Just start talking.')
        : !SR ? 'Voice isn’t available in this browser, so type instead.'
        : ans ? 'Paused. Tap to keep talking.' : 'Tap the mic and talk.');
    const body = J.listening
      ? '<div class="j-text" data-key="live' + step + '" aria-live="polite"><span id="j-final">' + esc(ans) + '</span>' +
          '<span id="j-interim">' + (J.interim ? (ans ? ' ' : '') + esc(J.interim) : '') + '</span><span class="caret"></span></div>'
      : '<textarea id="j-text" class="j-text" data-key="edit' + step + '" rows="1" aria-label="Your answer" placeholder="' + (SR ? 'Or type it out…' : 'Start writing…') + '">' + esc(ans) + '</textarea>';
    const steps = [0, 1, 2].map((i) =>
      '<button class="j-step' + (dr.answers[i].trim() || (i === step && J.interim) ? ' done' : '') + (i === step ? ' cur' : '') + '" data-act="j-goto" data-v="' + i + '" aria-label="Question ' + (i + 1) + '"' + (i === step ? ' aria-current="step"' : '') + '><span></span></button>').join('');

    return '<section class="screen white">' +
      header('<a class="back" href="#/today" aria-label="Close journal">' + I.close + 'Close</a>',

      '<div class="stack" style="margin-top:40px;flex:1 0 auto">' +
        '<div class="j-prompt' + (has ? ' has' : '') + '" data-key="q' + step + '">' + qs[step] + '</div>' +

        (fresh && entries.length
          ? '<div style="margin-top:auto;padding-top:40px"><div class="row" style="margin-bottom:6px"><div class="small">Earlier today</div><a class="small" href="#/entries" style="color:var(--muted)">All entries</a></div>' +
              entries.map((e) => '<div class="entry"><div class="small" style="margin-bottom:6px">' +

                  ? e.qa.map((x) => '<div class="small" style="margin-top:8px">' + esc(x.q) + '</div><div>' + esc(x.a) + '</div>').join('')
                  : (e.prompt ? '<div class="small">' + esc(e.prompt) + '</div>' : '') + esc(e.text)) +

  function jRefreshNext() {
    const nx = jNext(jDraft());
    const b = document.querySelector('.j-done');
    if (b) { b.textContent = nx.label; b.disabled = nx.disabled; }
    const cur = document.querySelector('.j-step.cur');

  }

  function jAppend(t) {
    t = t.trim();
    if (!t) return;
    const dr = jDraft();
    const cur = dr.answers[dr.step];
    if (!cur || /[.!?]\s*$/.test(cur)) t = t[0].toUpperCase() + t.slice(1);
    const sep = cur && !/\s$/.test(cur) ? ' ' : '';
    dr.answers[dr.step] = cur + sep + t;
    save();
    const fin = document.getElementById('j-final');
    if (fin) { const sp = document.createElement('span'); sp.className = 'word-in'; sp.textContent = sep + t; fin.appendChild(sp); }
    const pr = document.querySelector('.j-prompt'); if (pr) pr.classList.add('has');
    const st = document.getElementById('j-status'); if (st) st.textContent = 'Listening…';
    jRefreshNext();
  }

  function startListening() {
    if (!SR || J.listening) return;
    J.error = ''; J.interim = '';
    const r = new SR();
    r.continuous = true;
    r.interimResults = true;
    r.lang = navigator.language || 'en-US';
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) jAppend(res[0].transcript); else interim += res[0].transcript;
      }
      J.interim = interim.trim();
      const el = document.getElementById('j-interim');
      const dr = jDraft();
      if (el) el.textContent = J.interim ? (dr.answers[dr.step] ? ' ' : '') + J.interim : '';
      if (J.interim) {
        const pr = document.querySelector('.j-prompt'); if (pr) pr.classList.add('has');
        const st = document.getElementById('j-status'); if (st) st.textContent = 'Listening…';
      }
      jRefreshNext();
    };
    r.onerror = (e) => {
      if (['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)) {
        J.error = e.error === 'audio-capture' ? 'No microphone found, so type instead.' : 'Microphone access is blocked, so type instead.';
        J.listening = false;
      }
    };
    r.onend = () => {
      // Browsers end recognition after a pause; keep going while the user wants to talk.
      if (J.listening && jRec === r && route() === 'journal') { try { r.start(); return; } catch (err) { /* fall through */ } }
      if (jRec === r) jRec = null;
      J.listening = false; J.interim = '';
      if (route() === 'journal') render();
    };
    try { r.start(); jRec = r; J.listening = true; } catch (e) { J.listening = false; }
  }
  function stopListening() {
    J.listening = false;
    if (jRec) { try { jRec.stop(); } catch (e) { /* ignore */ } }
  }
  // Moving to another question mid-sentence: drop the half-heard words so they don't land on the new question.
  function jGoTo(step) {
    const dr = jDraft();
    const wasListening = J.listening;
    if (wasListening && jRec) {
      const old = jRec; jRec = null;
      old.onresult = null; old.onend = null; old.onerror = null;
      try { old.abort(); } catch (e) { /* ignore */ }
      J.listening = false;
    }
    J.interim = '';
    dr.step = step;
    save();
    if (wasListening) startListening();
    render();
  }
  function jFinish() {
    stopListening();
    const dr = jDraft();
    const qa = questionsFor().map((q, i) => ({ q, a: dr.answers[i].trim() })).filter((x) => x.a);
    if (!qa.length) return;

    location.hash = '#/today';

  }

  // Pin the share screen's wordmark to the exact pixels of the one underneath, so it never shifts.
  function placeMark() {
    const mark = $overlay.querySelector('.share-mark');
    const src = $screen.querySelector('.screen:not(.leave) .wordmark');
    if (!mark || !src) return;
    // Layout offsets ignore in-flight transforms, so a still-animating screen can't skew this.
    // Same layout rule as the screen header (left padding, top padding), so in-flight
    // entrance animations can't skew it. Only the screen's scroll offset matters.
    const screen = src.closest('.screen');
    mark.style.left = '';
    mark.style.top = 'calc(var(--top) - ' + screen.scrollTop + 'px)';
  }
  function fitCard() {
    const box = document.getElementById('card-box'), card = document.getElementById('card');

    const s = Math.min(1, box.clientWidth / 360, box.clientHeight / 640);
    card.style.transform = 'scale(' + s + ')';
    card.style.margin = (-(640 * (1 - s)) / 2) + 'px ' + (-(360 * (1 - s)) / 2) + 'px';
  }

  /* ---------- Toast ---------- */
  let toastTimer;

  /* ---------- Mind session control ---------- */
  let armTimer = null;
  function onOrient(e) {
    const m = S.timers.mind;
    if (!m || e.beta == null) return;
    m.sensor = true;
    const faceDown = Math.abs(e.beta) > 150;
    if (faceDown && m.state !== 'down') { m.runFrom = Date.now(); m.state = 'down'; save(); render(); }
    else if (!faceDown && m.state === 'down') { m.acc += Date.now() - m.runFrom; m.runFrom = null; m.state = 'up'; save(); render(); }
  }
  function listenOrientation(on) {
    window.removeEventListener('deviceorientation', onOrient);
    if (on) window.addEventListener('deviceorientation', onOrient);
  }
  async function startMind() {
    let allowed = 'DeviceOrientationEvent' in window;
    if (allowed && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { allowed = (await DeviceOrientationEvent.requestPermission()) === 'granted'; } catch (e) { allowed = false; }
    }
    S.timers.mind = { acc: 0, runFrom: null, state: 'arming', sensor: false };
    save(); render();
    if (allowed) listenOrientation(true);
    clearTimeout(armTimer);
    armTimer = setTimeout(() => {
      const m = S.timers.mind;
      if (m && !m.sensor && m.state === 'arming') { m.state = 'down'; m.runFrom = Date.now(); save(); render(); }
    }, allowed ? 1500 : 0);
  }
  function finishMind(cancel) {
    const m = S.timers.mind;
    if (!m) return;
    listenOrientation(false);
    clearTimeout(armTimer);
    const mins = Math.round(mindElapsed(m) / 60000);
    S.timers.mind = null;
    if (!cancel) {
      if (mins > 0) {
        const d = day();
        const before = d.mindMins || 0;
        d.mindMins = before + mins;
        toast(mins + ' min read' + (before < S.settings.mindGoal && d.mindMins >= S.settings.mindGoal ? '. Mind kept.' : ''));
      } else toast('Under a minute, not counted');
    }
    save(); render();
  }

  /* ---------- Work timer control ---------- */
  function workToggle() {
    const t = S.timers.work;
    const now = Date.now();
    if (!t) {
      const total = S.settings.focusMins * 60000;
      S.timers.work = { total, endsAt: now + total, remaining: total };
    } else if (t.endsAt) {
      t.remaining = Math.max(0, t.endsAt - now); t.endsAt = null;
    } else {
      t.endsAt = now + t.remaining;
    }
    save(); render();
  }
  function workComplete() {
    const t = S.timers.work;
    const d = day();
    d.blocks = (d.blocks || 0) + 1;
    d.workMins = (d.workMins || 0) + Math.round(t.total / 60000);
    S.timers.work = null;
    save();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    chime();
    toast('Block complete. Work kept.');
    render();
  }
  function workReset() {
    const t = S.timers.work;
    if (!t) return;
    const mins = Math.floor((t.total - t.remaining) / 60000);
    if (mins > 0) { const d = day(); d.workMins = (d.workMins || 0) + mins; toast(mins + ' min banked'); }
    S.timers.work = null;
    save(); render();
  }
  function chime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25].forEach((dt, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = i ? 784 : 659; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, ac.currentTime + dt);
        g.gain.exponentialRampToValueAtTime(0.2, ac.currentTime + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dt + 0.6);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + dt); o.stop(ac.currentTime + dt + 0.65);
      });
    } catch (e) { /* no audio */ }
  }

  /* ---------- Data tools ---------- */
  const DEMO_UPPER = ['chest', 'back', 'shoulders', 'biceps', 'triceps'];
  const DEMO_LOWER = ['quads', 'hamstrings', 'glutes', 'calves', 'core'];
  function demoLifts(i, upper) {
    const step = Math.floor((40 - i) / 6) * 5;
    const mk = (ex, w, r) => [0, 1, 2].map((n) => ({ id: 'd' + i + ex.length + n, ex, w, r: r - n }));
    return upper
      ? mk('Bench press', 135 + step, 8).concat(mk('Barbell row', 115 + step, 8))
      : mk('Squat', 185 + step, 6).concat(mk('Romanian deadlift', 155 + step, 8));
  }
  function loadDemo() {
    const now = new Date();
    const r = (a, b) => a + Math.random() * (b - a);
    const days = {};
    for (let i = 1; i <= 40; i++) {
      const dt = addDays(now, -i);
      const full = i <= 23;
      const bedM = Math.round(r(-50, 30)), sleepM = full ? Math.round(r(420, 510)) : Math.round(r(330, 480));
      const bedTot = (23 * 60 + bedM + 1440) % 1440, wakeTot = (bedTot + sleepM) % 1440;
      const hhmm = (t) => pad(Math.floor(t / 60)) + ':' + pad(t % 60);
      const trained = full || Math.random() > .4;
      days[keyOf(dt)] = {
        body: !trained ? null : i % 4 === 2
          ? { muscles: [], cardio: 5 * Math.round(r(5, 9)) }
          : { muscles: (i % 2 ? DEMO_UPPER : DEMO_LOWER).slice(), cardio: i % 5 === 0 ? 20 : 0 },
        mindMins: full ? Math.round(r(20, 45)) : Math.round(r(0, 30)),
        workMins: full ? 50 * Math.ceil(r(1, 3)) : Math.round(r(0, 60)),
        sleep: { bed: hhmm(bedTot), wake: hhmm(wakeTot), mins: sleepM }
      };
      days[keyOf(dt)].blocks = full ? days[keyOf(dt)].workMins / 50 : (days[keyOf(dt)].workMins >= 50 ? 1 : 0);
      const bd = days[keyOf(dt)].body;
      if (bd && bd.muscles.length) days[keyOf(dt)].lifts = demoLifts(i, bd.muscles === DEMO_UPPER || bd.muscles.includes('chest'));
    }
    S.days = days;
    days[todayKey()] = {
      body: { muscles: DEMO_LOWER.slice(), cardio: 0 },
      mindMins: 32,
      sleep: { bed: '23:04', wake: '06:36', mins: 452 },
      oneThing: (S.days[todayKey()] || {}).oneThing || '',
      journal: (S.days[todayKey()] || {}).journal || []
    };
    S.days = days;
    S.settings = { ...S.settings, routines: [{ id: 'upper', name: 'Upper', muscles: DEMO_UPPER.slice() }, { id: 'lower', name: 'Lower', muscles: DEMO_LOWER.slice() }], mindGoal: 20, focusMins: 50, sleepGoal: 7, bedtime: '23:00', book: { title: 'Meditations', author: 'Marcus Aurelius' } };
    S.timers = { mind: null, work: null };
    S.circle = { since: keyOf(addDays(now, -12)), notes: {} };
    // Third shipment, mailed two mornings ago, so the sample shows a package in transit.
    const shipped = new Date(now); shipped.setHours(8, 0, 0, 0);
    S.library = { joined: shipped.getTime() - 2 * 86400000 - 2 * LIB_CYCLE, picks: [], steer: '' };
    save();
  }
  function exportData() {

  function importData() {

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    switch (act) {
      case 'close': closeOverlay(); break;
      case 'journal': {
        const dr = jDraft();
        if (SR && !J.listening && !dr.answers[dr.step]) startListening();
        location.hash = '#/journal'; break;
      }
      case 'j-mic':
        if (J.listening) stopListening(); else startListening();
        render(); break;
      case 'j-type':
        stopListening(); render(); focusJournalText(); break;
      case 'j-goto': jGoTo(+el.dataset.v); break;
      case 'j-next': {
        const dr = jDraft();
        if (dr.step < 2) jGoTo(dr.step + 1); else jFinish();
        break;
      }
      case 'share': openShare('day'); break;
      case 'share-save': shareCard(el.dataset.v); break;
      case 'cardio-open': openCardio(); break;
      case 'open-day': S.ui.dayKey = el.dataset.v; save(); location.hash = '#/day'; break;
      case 'day-nav': {
        const next = keyOf(addDays(fromKey(dayKeyOpen()), +el.dataset.v));
        if (next > todayKey()) break;
        S.ui.dayKey = next; save(); render(); break;
      }
      case 'day-muscle': {
        const d = day(dayKeyOpen());
        const b = bodyOf(d);
        const id = el.dataset.v;
        const muscles = b.muscles.includes(id) ? b.muscles.filter((m) => m !== id) : b.muscles.concat(id);
        d.body = muscles.length || b.cardio ? { muscles, cardio: b.cardio } : null;
        save(); render(); break;
      }
      case 'day-num': {
        const d = day(dayKeyOpen());
        const v = +el.dataset.v;
        const f = el.dataset.f;
        if (f === 'cardio') {
          const b = bodyOf(d);
          const c = Math.max(0, Math.min(300, b.cardio + v));
          d.body = b.muscles.length || c ? { muscles: b.muscles, cardio: c } : null;
        } else if (f === 'mindMins') {
          d.mindMins = Math.max(0, Math.min(600, (d.mindMins || 0) + v));
        } else if (f === 'workMins') {
          d.workMins = Math.max(0, Math.min(900, (d.workMins || 0) + v));
          d.blocks = Math.floor(d.workMins / S.settings.focusMins);
        }
        save(); render(); break;
      }
      case 'day-sleep-clear': day(dayKeyOpen()).sleep = null; save(); render(); break;
      case 'cal-nav': S.ui.calOffset = Math.min(0, (S.ui.calOffset || 0) + +el.dataset.v); save(); render(); break;
      case 'open-week': S.ui.weekOffset = +el.dataset.v || 0; save(); location.hash = '#/week'; break;
      case 'week-nav': S.ui.weekOffset = Math.min(0, (S.ui.weekOffset || 0) + +el.dataset.v); save(); render(); break;
      case 'share-week': openShare('week'); break;
      case 'lifts-open': openLifts(el.dataset.v || todayKey()); break;
      case 'lift-pick': {
        const lx = document.getElementById('lx');
        lx.value = el.dataset.v;
        const last = liftHint();
        if (last) {
          const top = last.sets.reduce((a, x) => (e1rm(x) > e1rm(a) ? x : a));
          document.getElementById('lw').value = top.w || '';
          document.getElementById('lr').value = top.r || '';
        }
        document.getElementById(last ? 'lr' : 'lw').focus({ preventScroll: true });
        break;
      }
      case 'lift-add': {
        const k = S.ui.liftKey || todayKey();
        const ex = document.getElementById('lx').value.trim();
        const w = Math.max(0, parseFloat(document.getElementById('lw').value) || 0);
        const r = parseInt(document.getElementById('lr').value, 10);
        if (!ex) { toast('Name the exercise'); return; }
        if (!(r >= 1)) { toast('Add the reps'); return; }
        const d = day(k);
        const prev = bestBefore(ex, k);
        const todayBest = liftsOf(d).filter((x) => sameEx(x.ex, ex)).reduce((a, x) => (!a || e1rm(x) > e1rm(a) ? x : a), null);
        const set = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ex, w, r };
        d.lifts = liftsOf(d).concat(set);
        save(); refreshLifts();
        if (prev && e1rm(set) > e1rm(prev) && (!todayBest || e1rm(set) > e1rm(todayBest))) {
          if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
          toast('New best. ' + ex + ' ' + fmtSet(set) + ', up from ' + fmtSet(prev));
        }
        break;
      }
      case 'lift-del': {
        const d = day(S.ui.liftKey || todayKey());
        d.lifts = liftsOf(d).filter((x) => x.id !== el.dataset.v);
        if (!d.lifts.length) delete d.lifts;
        save(); refreshLifts(); break;
      }
      case 'unit': {
        S.settings.unit = el.dataset.v; save();
        const seg = el.parentElement;
        seg.querySelector('.seg-pill').style.setProperty('--k', el.dataset.v === 'kg' ? 1 : 0);
        seg.querySelectorAll('button').forEach((bt) => bt.setAttribute('aria-pressed', String(bt === el)));
        break;
      }
      case 'muscle': {
        const d = day();
        const wasKept = bodyKept(d);
        const b = bodyOf(d);
        const id = el.dataset.v;
        const muscles = b.muscles.includes(id) ? b.muscles.filter((m) => m !== id) : b.muscles.concat(id);
        d.body = muscles.length || b.cardio ? { muscles, cardio: b.cardio } : null;
        save(); render();
        if (!wasKept && bodyKept(d)) toast('Body kept');
        break;
      }
      case 'routine': {
        const r = S.settings.routines.find((x) => x.id === el.dataset.v);
        if (!r) break;
        const d = day();
        const wasKept = bodyKept(d);
        const b = bodyOf(d);
        const muscles = sameSet(b.muscles, r.muscles) ? [] : r.muscles.slice();
        d.body = muscles.length || b.cardio ? { muscles, cardio: b.cardio } : null;
        save(); render();
        if (!wasKept && bodyKept(d)) toast(r.name + ' logged. Body kept.');
        break;
      }
      case 'routine-save': openRoutineSave(); break;
      case 'routine-save-confirm': {
        const name = document.getElementById('rname').value.trim();
        if (!name) { toast('Give it a name'); return; }
        S.settings.routines.push({ id: Date.now().toString(36), name, muscles: bodyOf(peek(todayKey())).muscles.slice() });
        save(); closeOverlay(); render(); toast('Routine saved'); break;
      }
      case 'routines': openRoutines(); break;
      case 'routine-del': {
        S.settings.routines = S.settings.routines.filter((x) => x.id !== el.dataset.v);
        save(); render();
        el.closest('.rrow').remove();
        if (!S.settings.routines.length) closeOverlay();
        break;
      }
      case 'cardio-step': {
        S.ui.cardioMins = Math.min(240, Math.max(5, (S.ui.cardioMins || 30) + +el.dataset.v));
        save();
        const m = document.getElementById('c-mins');
        if (m) { tween(m, +m.dataset.count, S.ui.cardioMins, 260); m.dataset.count = S.ui.cardioMins; }
        const lb = document.getElementById('c-log');
        if (lb) lb.textContent = 'Log ' + S.ui.cardioMins + ' min cardio';
        break;
      }
      case 'cardio-log': {
        const d = day();
        const wasKept = bodyKept(d);
        const mins = S.ui.cardioMins || 30;
        d.body = { muscles: bodyOf(d).muscles, cardio: mins };
        save(); closeOverlay(); render(); toast(mins + ' min cardio logged' + (wasKept ? '' : '. Body kept.')); break;
      }
      case 'cardio-undo': {
        const d = day();
        const b = bodyOf(d);
        d.body = b.muscles.length ? { muscles: b.muscles, cardio: 0 } : null;
        save(); closeOverlay(); render(); break;
      }
      case 'book': openBook(); break;
      case 'book-save':
        S.settings.book = { title: document.getElementById('btitle').value.trim(), author: document.getElementById('bauthor').value.trim() };
        save(); closeOverlay(); render(); break;
      case 'mind-start': startMind(); break;
      case 'mind-pause': { const m = S.timers.mind; m.acc += Date.now() - m.runFrom; m.runFrom = null; m.state = 'up'; save(); render(); break; }
      case 'mind-resume': { const m = S.timers.mind; m.runFrom = Date.now(); m.state = 'down'; save(); render(); break; }
      case 'mind-finish': finishMind(false); break;
      case 'mind-cancel': finishMind(true); break;
      case 'work-toggle': workToggle(); break;
      case 'work-reset': workReset(); break;
      case 'sleep': openSleep(); break;
      case 'sleep-save': {
        const bed = document.getElementById('sbed').value, wake = document.getElementById('swake').value;
        if (!bed || !wake) { toast('Add both times'); return; }
        day().sleep = { bed, wake, mins: sleepMins(bed, wake) };
        save(); closeOverlay(); render(); break;
      }
      case 'sleep-clear': day().sleep = null; save(); closeOverlay(); render(); break;
      case 'settings': openSettings(); break;
      case 'member': openMember(el.dataset.v); break;
      case 'circle-note': openCircleNote(); break;
      case 'circle-note-save': {
        const t = document.getElementById('cnote').value.trim();
        if (!t) { toast('Write something first'); return; }
        S.circle.notes[weekKey()] = t; save(); closeOverlay(); render(); toast('Posted to your circle'); break;
      }
      case 'circle-note-clear': delete S.circle.notes[weekKey()]; save(); closeOverlay(); render(); break;
      case 'library-read': {
        const b = libraryState().book;
        S.settings.book = { title: b.t, author: b.a }; save(); location.hash = '#/mind'; toast('Now reading ' + b.t); break;
      }
      case 'library-steer': openSteer(); break;
      case 'library-steer-save':
        S.library.steer = document.getElementById('lsteer').value.trim(); save(); closeOverlay(); render(); toast(S.library.steer ? 'Your librarian will see this' : 'Saved'); break;
      case 'replay-intro':
        S.profile.done = false; S.profile.step = 0; save(); closeOverlay(true); location.hash = '#/welcome'; render(); break;
      case 'ob-next': {
        const nm = document.getElementById('ob-name');
        if (nm) S.profile.name = nm.value.trim();
        obGo((S.profile.step || 0) + 1); break;
      }
      case 'ob-back': obGo((S.profile.step || 0) - 1); break;
      case 'ob-plan': S.profile.plan = S.profile.plan === el.dataset.v ? null : el.dataset.v; save(); render(); break;
      case 'ob-goal': {
        const o = OB_GOALS.find((x) => x.key === el.dataset.k);
        const dir = +el.dataset.v;
        if (o.key === 'bedtime') {
          const [h, m] = S.settings.bedtime.split(':').map(Number);
          const t = (((h * 60 + m + dir * o.step) % 1440) + 1440) % 1440;
          S.settings.bedtime = pad(Math.floor(t / 60)) + ':' + pad(t % 60);
        } else {
          S.settings[o.key] = Math.min(o.max, Math.max(o.min, Math.round((S.settings[o.key] + dir * o.step) * 2) / 2));
        }
        save(); render(); break;
      }
      case 'ob-finish': obFinish(); break;
      case 'settings-save': {
        const num = (id, lo, hi, def) => { const v = parseFloat(document.getElementById(id).value); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def; };
        const g = S.settings;
        g.mindGoal = Math.round(num('g-mind', 1, 240, g.mindGoal));
        g.focusMins = Math.round(num('g-focus', 1, 180, g.focusMins));
        g.sleepGoal = num('g-sleep', 1, 12, g.sleepGoal);
        g.bedtime = document.getElementById('g-bed').value || g.bedtime;
        S.profile.name = document.getElementById('g-name').value.trim();
        save(); closeOverlay(); render(); toast('Saved'); break;
      }
      case 'motion': {
        S.settings.motion = el.dataset.v; save(); applyMotion();
        const seg = el.parentElement;
        seg.querySelector('.seg-pill').style.setProperty('--k', ['on', 'system', 'off'].indexOf(el.dataset.v));
        seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === el)));
        break;
      }
      case 'export': exportData(); break;
      case 'import': importData(); break;
      case 'demo':
        if (Object.keys(S.days).length && !confirm('Replace your data with a sample month?')) return;
        loadDemo(); closeOverlay(); location.hash = '#/today'; render(); toast('Sample month loaded'); break;
      case 'wipe':
        if (!confirm('Erase all Kept data in this browser? This cannot be undone.')) return;
        S = defaults(); save(); applyMotion(); closeOverlay(); location.hash = '#/today'; render(); break;
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'one-thing') { day().oneThing = e.target.value; save(); }
    if (e.target.id === 'entry-q') { S.ui.q = e.target.value; save(); render(); }
    if (e.target.id === 'lx') liftHint();
    if (e.target.id === 'ob-name') {
      S.profile.name = e.target.value.trim(); save();
      const cta = document.getElementById('ob-cta'); if (cta) cta.textContent = S.profile.name ? 'Continue' : 'Skip';
    }
    if (e.target.id === 'j-text') {
      const ta = e.target;
      const dr = jDraft(); dr.answers[dr.step] = ta.value; save(); growText(ta);
      const pr = document.querySelector('.j-prompt'); if (pr) pr.classList.toggle('has', !!ta.value);
      jRefreshNext();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlayOpen()) closeOverlay();
    if (e.key === 'Enter' && e.target.id === 'one-thing') e.target.blur();
    if (e.key === 'Enter' && e.target.id === 'lr') { e.preventDefault(); const b = document.querySelector('[data-act="lift-add"]'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target.id === 'ob-name') { e.preventDefault(); const b = document.getElementById('ob-cta'); if (b) b.click(); }
    if (e.key === 'Enter' && e.target.id === 'rname') { const b = document.querySelector('[data-act="routine-save-confirm"]'); if (b) b.click(); }
  });
  window.addEventListener('resize', () => { placeMark(); fitCard(); });
  // Past-day sleep times save as soon as both are set.
  document.addEventListener('change', (e) => {
    if (e.target.id !== 'day-bed' && e.target.id !== 'day-wake') return;
    const bed = document.getElementById('day-bed').value, wake = document.getElementById('day-wake').value;
    if (!bed || !wake) return;
    day(dayKeyOpen()).sleep = { bed, wake, mins: sleepMins(bed, wake) };
    save(); render();
  });

  /* ---------- Router & loop ---------- */
  const route = () => {
    if (!S.profile.done) return 'welcome';
    const r = location.hash.replace(/^#\/?/, '') || 'today';
    return screens[r] ? r : 'today';
  };
  let lastDay = todayKey();

  /* Count-up numbers: any element with data-count tweens between values. */
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  function tween(el, from, to, dur = 650, delay = 0) {
    const fmt = el.dataset.fmt === 'hm' ? fmtHM : (v) => String(Math.round(v));
    if (el._tw) cancelAnimationFrame(el._tw);
    if (reduceMotion() || from === to) { el.textContent = fmt(to); el._tw = null; return; }
    el.textContent = fmt(from);
    const start = performance.now() + delay;
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - start) / dur));
      el.textContent = fmt(from + (to - from) * easeOut(t));
      el._tw = t < 1 ? requestAnimationFrame(step) : null;
    };
    el._tw = requestAnimationFrame(step);
  }
  function countIn(root, dur = 900, delay = 150) {
    root.querySelectorAll('[data-count]').forEach((el) => tween(el, 0, +el.dataset.count, dur, delay));
  }

  /* Minimal DOM morph: patch the live screen toward the new markup so CSS
     transitions (fills, heights, the segment pill) animate instead of snapping. */
  function syncAttrs(f, t) {
    for (const a of [...f.attributes]) if (!t.hasAttribute(a.name)) f.removeAttribute(a.name);
    for (const a of [...t.attributes]) if (f.getAttribute(a.name) !== a.value) f.setAttribute(a.name, a.value);
  }
  function morph(f, t) {
    syncAttrs(f, t);
    const fc = [...f.childNodes], tc = [...t.childNodes];
    tc.forEach((tn, i) => {
      const fn = fc[i];
      if (!fn) { f.appendChild(tn); if (tn.nodeType === 1) tn.classList.add('swap-in'); return; }
      const sameKind = fn.nodeType === tn.nodeType && fn.nodeName === tn.nodeName &&
        (fn.nodeType !== 1 || fn.getAttribute('data-key') === tn.getAttribute('data-key'));
      if (!sameKind) { f.replaceChild(tn, fn); if (tn.nodeType === 1) tn.classList.add('swap-in'); return; }
      if (fn.nodeType === 3) { if (fn.nodeValue !== tn.nodeValue) fn.nodeValue = tn.nodeValue; return; }
      if (fn.nodeType !== 1) return;
      if (fn.hasAttribute('data-count') && tn.hasAttribute('data-count')) {
        const a = +fn.dataset.count, b = +tn.dataset.count;
        syncAttrs(fn, tn);
        if (a !== b) tween(fn, a, b);
        else if (!fn._tw && fn.textContent !== tn.textContent) fn.textContent = tn.textContent;
        return;
      }
      morph(fn, tn);
    });
    for (let i = tc.length; i < fc.length; i++) fc[i].remove();
  }

  const DEPTH = { today: 0, body: 1, mind: 1, work: 1, rest: 1, progress: 1, journal: 1, day: 2, entries: 2, week: 2, circle: 2, library: 2 };
  function render(force) {
    const r = route();
    const tpl = document.createElement('template');
    tpl.innerHTML = screens[r]().trim();
    const next = tpl.content.firstElementChild;
    next.dataset.route = r + (r === 'mind' && S.timers.mind ? ':session' : '') + (next.dataset.step != null ? ':' + next.dataset.step : '');
    const old = [...$screen.children].find((c) => !c.classList.contains('leave'));

    if (old && old.dataset.route === next.dataset.route && !force) {
      const keep = [...old.classList].filter((c) => c.startsWith('enter'));
      morph(old, next);
      keep.forEach((c) => old.classList.add(c));
    } else {
      const from = old ? old.dataset.route.split(':')[0] : null;
      // Stepping through the same screen (intro steps, days, weeks) slides by direction.
      const dir = old && from === r && old.dataset.step != null && next.dataset.step != null ? (+next.dataset.step > +old.dataset.step ? 'fwd' : 'back')
        : !old || r === 'journal' || from === 'journal' ? 'fade' : from === r ? 'fade' : DEPTH[r] > DEPTH[from] ? 'fwd' : DEPTH[r] < DEPTH[from] ? 'back' : 'fade';
      if (old) {
        old.querySelectorAll('[id]').forEach((e) => e.removeAttribute('id'));
        old.classList.remove('enter', 'enter-fwd', 'enter-back', 'enter-fade');
        old.classList.add('leave', 'leave-' + dir);
        setTimeout(() => old.remove(), reduceMotion() ? 0 : 400);
      }
      next.classList.add('enter', 'enter-' + dir);
      $screen.appendChild(next);
      countIn(next);
      setTimeout(() => next.classList.remove('enter', 'enter-' + dir), 2000);
    }
    document.title = r === 'today' ? 'Kept' : 'Kept · ' + r[0].toUpperCase() + r.slice(1);
    const night = r === 'mind' && S.timers.mind;
    document.querySelector('meta[name="theme-color"]').content = night || r === 'welcome' ? '#0B0B0B' : r === 'journal' ? '#FFFFFF' : '#F4F3F1';
    const jt = document.getElementById('j-text'); if (jt) growText(jt);
  }
  window.addEventListener('hashchange', () => { if (route() !== 'journal') stopListening(); closeOverlay(); render(); });

  function tick() {
    if (todayKey() !== lastDay) { lastDay = todayKey(); render(); return; }
    const t = S.timers.work;
    if (t && t.endsAt && Date.now() >= t.endsAt) { workComplete(); return; }
    const r = route();
    if (r === 'work') {
      const v = workView();
      const c = document.getElementById('work-clock');
      if (c && c.textContent !== v.clock) {
        c.textContent = v.clock;
        document.getElementById('work-bar').style.width = v.pct + '%';
        document.getElementById('work-note').textContent = v.note;
      }
    } else if (r === 'mind' && S.timers.mind) {
      const c = document.getElementById('mind-clock');
      if (c) c.textContent = fmtClock(mindElapsed(S.timers.mind));
    }
  }
  setInterval(tick, 250);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  // Resume a reading session that survived a reload
  if (S.timers.mind) {
    listenOrientation(true);
    if (S.timers.mind.state === 'arming') { S.timers.mind.state = 'down'; S.timers.mind.runFrom = Date.now(); save(); }
  }
  // Installing, offline use and the mic all need https, so hop over from plain http (local dev excepted).
  if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$|^192\.168\.|^10\./.test(location.hostname)) {
    location.replace('https://' + location.host + location.pathname + location.search + location.hash);
  }
  // Installable app: cache the app so it opens offline. Needs http(s), so skip when opened as a file.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ }));
  }
  applyMotion();
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', applyMotion);
  render();
})();
</script>
</body>
</html>
